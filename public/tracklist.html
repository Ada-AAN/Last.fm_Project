<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Album Tracklist | Records Report</title>
  <link href="https://fonts.cdnfonts.com/css/gajraj-one" rel="stylesheet">
  <link
    href="https://cdn.fonts.net/kit/7b6b1e00-8b68-11ec-9ce3-0220834439f4/7b6b1e00-8b68-11ec-9ce3-0220834439f4.css"
    rel="stylesheet"
  >
  <link href="style.css" rel="stylesheet">
</head>

<body class="tracklist-page">
  <div class="loader" role="status" aria-label="Loading album and tracklist">
    <img src="images/records-record-default.svg" alt="">
  </div>
  <img class="tracklist-waveform" src="images/artist-waveform.svg" alt="" aria-hidden="true">
  <main class="tracklist-layout">
    <section class="tracklist-album" aria-label="Album details">
      <a class="tracklist-back" href="/index.html">Back to Artist</a>
      <div class="tracklist-artwork">
        <img class="tracklist-record" src="images/tracklist-record.svg" alt="" aria-hidden="true">
        <img id="album-cover" class="tracklist-cover" alt="">
      </div>
      <p id="album-summary" class="tracklist-summary"></p>
      <a id="album-lastfm" class="tracklist-lastfm" target="_blank" rel="noopener noreferrer">
        Read more on Last.fm
      </a>
    </section>

    <section class="tracklist-songs" aria-labelledby="album-title">
      <h1 id="album-title">Album Name</h1>
      <h2>Tracklist</h2>
      <p id="tracklist-status" role="status" aria-live="polite">Loading tracklist...</p>
      <ol id="track-list"></ol>
    </section>
  </main>
  <footer class="tracklist-footer">
    <p>Designed using the <a href="https://www.last.fm/api">Last.fm API</a></p>
  </footer>
  <script src="tracklist.js" type="module"></script>
</body>

</html>
