<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Artist Profile - Stats Central</title>
  <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet">
  <link
    href="https://cdn.fonts.net/kit/7b6b1e00-8b68-11ec-9ce3-0220834439f4/7b6b1e00-8b68-11ec-9ce3-0220834439f4.css"
    rel="stylesheet"
  />
  <link href="style.css" rel="stylesheet" type="text/css">
</head>

<body>
  <header>
    <h1>Stats Central</h1>
  </header>
  <main class="artist-profile-page">
    <a class="back-link" href="/">Back to genres</a>
    <p id="profile-status" role="status">Loading artist...</p>
    <article id="artist-profile" class="artist-profile" hidden>
      <img class="artist-profile-image" alt="">
      <div>
        <h2 class="artist-profile-name"></h2>
        <p class="artist-profile-stats"></p>
        <p class="artist-profile-bio"></p>
        <a class="artist-profile-lastfm" target="_blank" rel="noopener noreferrer">View on Last.fm</a>
      </div>
    </article>
        <div class="top-albums-section">
      <h2>Top Albums</h2>
         <div id="artist-albums" class="artist-albums"></div>
        </div>
  </main>
  <script src="artist-profile.js" type="module"></script>
</body>

</html>
