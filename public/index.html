<!DOCTYPE html>
<html>

<head>

  <meta
    name="viewport"
    content="width=device-width"
  >

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet">
  <!-- Display font for headings. -->
  <link
    href="https://fonts.cdnfonts.com/css/gajraj-one"
    rel="stylesheet"
  >

  <!-- Dom Purify library helps to Sanitize dynamic HTML strings.-->
  <script
    src="https://cdn.jsdelivr.net/npm/dompurify@3.2.7/dist/purify.min.js"
    integrity="sha256-QM/0krVDU6Vc35/7NpeGU5/7fVTSX5fdSh6JdbMJw10="
    crossorigin="anonymous"
  ></script>

  <!-- Twentieth Century font via Monotype.com --->
  <link
    href="https://cdn.fonts.net/kit/7b6b1e00-8b68-11ec-9ce3-0220834439f4/7b6b1e00-8b68-11ec-9ce3-0220834439f4.css"
    rel="stylesheet"
  />

  <link
    href="style.css"
    rel="stylesheet"
    type="text/css"
  />
  <!-- Placeholder favicon. -->
  <link
    href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mN8HxzwHwAGXgKT5yJ2+AAAAABJRU5ErkJggg=="
    rel="icon"
    type="image/x-icon"
  >
</head>

<body class="charts-page">
  <div class="loader" role="status" aria-label="Loading genres">
    <img src="images/records-record-default.svg" alt="">
  </div>
  <header class="charts-header">
    <h1>TOP GENRES</h1>
    <time id="charts-date" aria-label="Page date"></time>
  </header>
  <main class="genre-grid" aria-label="Top music genres"></main>
  <footer class="charts-footer">
    <p>Designed using the <a href="https://www.last.fm/api">Last.fm API</a></p>
  </footer>
  <script
    src="main.js"
    type="module"
  ></script>
</body>

</html>
